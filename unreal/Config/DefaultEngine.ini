[/Script/Engine.RendererSettings]
; PC-only visual review target. The UE5.5 project has NOT been compiled/rendered.
; Renderer settings are starting assumptions to validate on a real Windows GPU.
r.DefaultFeature.AutoExposure=True
; 4 = Temporal Super Resolution (TSR), replacing the earlier TAA setting (2).
r.DefaultFeature.AntiAliasing=4
; Lumen diffuse GI and reflections for cinematic stadium daylight/shadow review.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Required by software Lumen's mesh distance field representation.
r.GenerateMeshDistanceFields=True
; Virtual shadow maps for detailed roof, footballer and turf shadows.
r.Shadow.Virtual.Enable=1
; Do not turn hardware ray tracing on automatically: GPU requirements vary.
; Nanite is enabled per imported compatible static mesh, not a guarantee of
; detail in the placeholder meshes and not a substitute for photorealistic art.
