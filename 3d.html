<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071a15"><title>Sports Arcade | 3D Stadium Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071a15;color:#f0f5ef;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;touch-action:none}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:start;gap:12px;pointer-events:none}
.brand{font-size:13px;font-weight:900;letter-spacing:.13em;background:#071c16c9;padding:12px 14px;border-radius:12px;border:1px solid #487456}.brand em{color:#c8ff45;font-style:normal}small{display:block;margin-top:4px;color:#b0c9bb;font-size:10px;font-weight:500;letter-spacing:.07em}
#hud button{pointer-events:auto;border:1px solid #6f9675;background:#0c2c22d9;color:white;border-radius:10px;padding:11px;font-weight:800}
#footer{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#081c17d9;border:1px solid #4b6a58;border-radius:14px;padding:10px 16px;white-space:nowrap;text-align:center;font-size:12px;max-width:95vw}
#footer b{color:#c8ff45}.control{display:inline-flex;gap:6px;align-items:center}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#071f19ed;padding:18px;border-radius:14px;max-width:85vw;text-align:center}
@media(max-width:600px){.brand{font-size:11px;padding:9px}.brand small{font-size:9px}#footer{font-size:11px;white-space:normal;width:92vw}}
</style></head>
<body><div id="hud"><div class="brand"><em>✦</em> SPORTS ARCADE <small>3D STADIUM • VISUAL FOUNDATION v0.1</small></div><button id="cameraBtn">CAMERA: BROADCAST</button></div>
<div id="footer"><b>3D GRAPHICS TEST</b> · Drag to look around · Pinch / scroll to zoom · Tap CAMERA to change view</div>
<div id="message">Loading 3D stadium…</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9db5bd);scene.fog=new THREE.FogExp2(0x9db5bd,.004);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.5,700);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xddecff,0x243c29,2.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff3d4,2.8);sun.position.set(-65,125,50);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-110;sun.shadow.camera.right=110;sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;sun.shadow.bias=-.00014;scene.add(sun);
function mat(color,roughness=1,metalness=0){return new THREE.MeshStandardMaterial({color,roughness,metalness})}
function mesh(g,m,x=0,y=0,z=0,shadow=false){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}
const turf=mat(0x347a3f),lineMat=new THREE.MeshBasicMaterial({color:0xe0ece0});
mesh(new THREE.PlaneGeometry(250,200),mat(0x284e34),0,-.12,0).rotation.x=-Math.PI/2;
mesh(new THREE.PlaneGeometry(110,76),turf,0,0,0).rotation.x=-Math.PI/2;
for(let i=0;i<12;i++){const color= i%2?0x347c40:0x31743b;const b=mesh(new THREE.PlaneGeometry(110/12,76),mat(color),-55+(i+.5)*110/12,.018,0);b.rotation.x=-Math.PI/2;}
function line(x1,z1,x2,z2,w=.13){const d=Math.hypot(x2-x1,z2-z1);let l=mesh(new THREE.PlaneGeometry(d,w),lineMat,(x1+x2)/2,.046,(z1+z2)/2);l.rotation.x=-Math.PI/2;l.rotation.z=-Math.atan2(z2-z1,x2-x1);}
function rectangle(x1,z1,x2,z2){line(x1,z1,x2,z1);line(x2,z1,x2,z2);line(x2,z2,x1,z2);line(x1,z2,x1,z1)}
rectangle(-52,-34,52,34);line(0,-34,0,34);for(let side of [-1,1]){const edge=52*side;rectangle(edge,-20.2,edge-side*16.5,20.2);rectangle(edge,-9.2,edge-side*5.5,9.2);}
const circle=mesh(new THREE.RingGeometry(9.1,9.23,96),lineMat,0,.052,0);circle.rotation.x=-Math.PI/2;
for(let x of [-41,0,41]){let dot=mesh(new THREE.CircleGeometry(.3,20),lineMat,x,.055,0);dot.rotation.x=-Math.PI/2}
for(let x of [-1,1]){let arc=mesh(new THREE.RingGeometry(9.1,9.22,64,1,Math.PI*1.1,Math.PI*.8),lineMat,x*41,.054,0);arc.rotation.x=-Math.PI/2;}
const white=mat(0xf6f7ef,.58,.07),net=new THREE.LineBasicMaterial({color:0xe5f2e9,transparent:true,opacity:.48});
function post(a,b,r=.16){let v=new THREE.Vector3().subVectors(b,a),o=mesh(new THREE.CylinderGeometry(r,r,v.length(),10),white,(a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2,true);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());}
for(const side of [-1,1]){const x=52*side,bx=56*side;post(new THREE.Vector3(x,0,-7.3),new THREE.Vector3(x,2.44,-7.3));post(new THREE.Vector3(x,0,7.3),new THREE.Vector3(x,2.44,7.3));post(new THREE.Vector3(x,2.44,-7.3),new THREE.Vector3(x,2.44,7.3));const pts=[];for(let z=-7.3;z<=7.31;z+=.9){pts.push(bx,.1,z,bx,2.45,z);pts.push(x,2.45,z,bx,2.45,z)}for(let y=.1;y<=2.46;y+=.6){pts.push(bx,y,-7.3,bx,y,7.3);pts.push(x,y,-7.3,bx,y,-7.3);pts.push(x,y,7.3,bx,y,7.3)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.LineSegments(g,net));}
const standMat=[mat(0x1a3030),mat(0x273f43),mat(0x334e50)],seatColors=[mat(0x183d3b),mat(0x226056),mat(0x6a847d),mat(0xc4c8b1)];
function box(w,h,d,m,x,y,z){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,true)}
for(const side of [-1,1]){for(let tier=0;tier<14;tier++){const out=42+tier*1.85,y=.9+tier*.92;box(150,.38,1.8,standMat[tier%3],0,y,side*out);for(let n=-59;n<=59;n+=3.1){box(1.8,.15,.65,seatColors[(Math.abs(Math.round(n*3+tier*7)))%4],n,y+.33,side*out);}}
for(let tier=0;tier<13;tier++){const out=63+tier*1.7,y=.8+tier*.92;box(1.4,.38,120,standMat[tier%3],side*out,y,0);for(let n=-52;n<=52;n+=3.1){box(.65,.15,1.9,seatColors[(Math.abs(Math.round(n*3+tier*7)))%4],side*out,y+.32,n);}}}
for(let side of [-1,1]){box(110,2,.3,mat(0x193e34),0,1.05,side*35);box(.3,2,72,mat(0x193e34),side*53,1.05,0);}
for(let i=0;i<18;i++){const x=-46+i*5.4;let board=box(4.8,1,.08,mat(i%2?0x0a5a48:0x9acf36,.4),x,.9,-35.3);board.castShadow=false;}
const skin=mat(0xb98265,.76),darkSkin=mat(0x684735,.79),yellow=mat(0xd1f344,.72),red=mat(0xc94e4f,.74),shorts=mat(0x1c3535),boot=mat(0x141e1c);
function footballer(x,z,kit,num,scale=1){let group=new THREE.Group();scene.add(group);group.position.set(x,0,z);group.scale.setScalar(scale);
const add=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;group.add(o);return o};
add(new THREE.CylinderGeometry(.37,.39,.85,12),kit,0,1.72,0);add(new THREE.SphereGeometry(.29,14,10),num%2?skin:darkSkin,0,2.45,0);add(new THREE.BoxGeometry(.71,.4,.47),kit,0,2.05,0);add(new THREE.BoxGeometry(.68,.3,.49),shorts,0,1.23,0);
for(const s of [-1,1]){add(new THREE.CylinderGeometry(.14,.115,.83,9),num%2?skin:darkSkin,s*.21,.71,0);add(new THREE.BoxGeometry(.26,.13,.46),boot,s*.21,.19,.11);add(new THREE.CylinderGeometry(.115,.095,.72,8),kit,s*.53,1.72,.02);}
group.rotation.y=num%2?-.3:.3;return group}
const players=[];for(let i=0;i<11;i++){let z=((i%5)-2)*11;let x=-38+Math.floor(i/5)*17;players.push(footballer(x,z,yellow,i));players.push(footballer(-x,-z,red,i+11));}
const ball=mesh(new THREE.SphereGeometry(.33,32,24),mat(0xf3f3e8,.38,.04),0,.35,0,true);
const panel=mat(0x243333,.78);for(let i=0;i<10;i++){let a=(i*2.399),y=Math.cos(i*Math.PI/5)*.26;let b=new THREE.Mesh(new THREE.CircleGeometry(.063,6),panel);let rr=Math.sqrt(Math.max(0,.32*.32-y*y));b.position.set(Math.cos(a)*rr,.35+y,Math.sin(a)*rr);b.lookAt(ball.position);scene.add(b);}
const positions=[new THREE.Vector3(0,79,123),new THREE.Vector3(109,51,76),new THREE.Vector3(0,21,50)],targets=[new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,0)];let mode=0,yaw=0,pitch=0,zoom=1,drag=false,prevX=0,prevY=0,touchDistance=0;
function cameraUpdate(){let p=positions[mode];let v=p.clone().sub(targets[mode]);let r=Math.hypot(v.x,v.z)*zoom;let angle=Math.atan2(v.x,v.z)+yaw;camera.position.set(Math.sin(angle)*r,Math.max(11,p.y*zoom+pitch),Math.cos(angle)*r);camera.lookAt(targets[mode]);}
document.getElementById('cameraBtn').addEventListener('click',()=>{mode=(mode+1)%3;yaw=0;pitch=0;zoom=1;document.getElementById('cameraBtn').textContent='CAMERA: '+['BROADCAST','CORNER','PITCHSIDE'][mode]});
const c=renderer.domElement;c.addEventListener('pointerdown',e=>{drag=true;prevX=e.clientX;prevY=e.clientY;c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-prevX)*.003;pitch=Math.min(80,Math.max(-35,pitch+(prevY-e.clientY)*.21));prevX=e.clientX;prevY=e.clientY});
c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);
c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2.5,zoom+Math.sign(e.deltaY)*.09))},{passive:false});
c.addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(touchDistance)zoom=Math.max(.5,Math.min(2.5,zoom*touchDistance/d));touchDistance=d}else touchDistance=0},{passive:true});
c.addEventListener('touchend',()=>touchDistance=0);
function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<700?57:46;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
document.getElementById('message').remove();let t0=performance.now();function render(t){cameraUpdate();ball.rotation.z=(t-t0)*.00016;renderer.render(scene,camera);requestAnimationFrame(render)}requestAnimationFrame(render);
</script></body></html>
