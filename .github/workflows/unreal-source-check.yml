name: Verify Unreal source scaffold

on:
  push:
    paths:
      - "unreal/**"
      - ".github/workflows/unreal-source-check.yml"
  pull_request:
    paths:
      - "unreal/**"
      - ".github/workflows/unreal-source-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    name: Python static project checks (not Unreal build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run source and config checks
        run: |
          python3 -m unittest discover -s unreal/tests -v
          python3 -m compileall -q unreal/Tools/Editor unreal/asset_pipeline
